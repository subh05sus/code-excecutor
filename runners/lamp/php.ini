; XAMPP-like defaults: "localhost" with root and no password reaches the
; question's MariaDB over its socket; everything writable lives on /tmp.
mysqli.default_socket = /tmp/mysqld.sock
pdo_mysql.default_socket = /tmp/mysqld.sock
mysqli.default_host = localhost
mysqli.default_user = root
display_errors = On
html_errors = Off
error_reporting = E_ALL & ~E_DEPRECATED
log_errors = Off
session.save_path = /tmp/sessions
upload_tmp_dir = /tmp/uploads
sys_temp_dir = /tmp
max_execution_time = 10
memory_limit = 128M
post_max_size = 16M
upload_max_filesize = 8M
date.timezone = UTC
; PHP's built-in server is not the CLI to opcache, so it would cache compiled
; pages and re-check them only every 2 s — a student's save wouldn't show.
opcache.enable = 0
opcache.enable_cli = 0
